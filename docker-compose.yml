# Docker Phases 1-2 of the UnitPrep CI/CD framework -- see the vault's
# reference/UnitPrep CI-CD Framework.md and UnitPrep Docker Standards.md
# for the full design and why every choice below is made this way.
#
# test-db (phase 1): a single postgres:18 service for local ephemeral
# test-DB isolation -- spin up fresh, point real-DB tests at it, throw
# it away. Version matches the real Neon dev branch (18.6, confirmed
# via pg_dump's own header) -- not "latest", which would silently
# drift from it.
#
# api-dev (phase 2): a long-lived unitprep-api dev container, source
# bind-mounted, never rebuilt per code change. Auto-runs the full
# workspace test suite on every save.
#
# Gated behind "test"/"dev" profiles (not started by a bare
# `docker compose up`) so this file stays safe to extend with
# unitprep-ui's own dev container later (Docker phase 3) without
# anything starting together by accident.
#
# Run:   docker compose --profile dev up -d      (starts both -- api-dev depends on test-db)
# Watch: docker compose logs -f api-dev
# Shell: docker compose exec api-dev bash
# Stop:  docker compose --profile dev down
#
# Mission-critical isolation (see the framework doc's isolation-controls
# section): neither service may ever be configured anywhere near a real
# Neon credential. No NEON_DEV_DATABASE_URL*/NEON_PROD_DATABASE_URL*
# anywhere in this file, ever -- local Docker gets the same guarantee
# as CI.

services:
  test-db:
    image: postgres:18
    # Both "test" and "dev" -- api-dev (below) depends on this service,
    # and Compose only auto-starts a dependency's own profile if that
    # profile is also requested; this makes `--profile dev` alone
    # enough to bring both up together.
    profiles: ["test", "dev"]
    environment:
      # Throwaway, localhost-only credentials for an ephemeral
      # container -- not a real secret, so not a ".env.local only"
      # violation (see Docker Standards' secrets-in-compose rule).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: unitprep_test
    ports:
      # 5433, not 5432 -- this machine already has a native Postgres
      # listening on 5432; a distinct port means a connection string
      # can never accidentally reach the wrong one. Bound to
      # 127.0.0.1 only, never the whole network.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10
    # No named volume for the data directory -- deliberately. tmpfs
    # keeps it in memory only, so it cannot outlive the container even
    # if something forgets to `down` it. Being thrown away is the
    # entire point of the isolation guarantee this container exists
    # for; a named volume here would be a real, if subtle, violation
    # of it.
    #
    # Mount point is /var/lib/postgresql (not .../data) -- the
    # postgres:18+ image switched to a pg_ctlcluster-style layout that
    # expects the parent directory, not the old major-version-agnostic
    # .../data path every prior major version's image used. Verified
    # empirically: mounting .../data crashes the container on startup
    # with an explicit error naming this exact change.
    tmpfs:
      - /var/lib/postgresql

  # Docker Phase 2 -- the long-lived unitprep-api dev container. Not
  # rebuilt per code change: source is bind-mounted below, never
  # baked into the image (see Dockerfile.dev). Left running all day,
  # same mental model as a persistent terminal tab with the right
  # toolchain pre-installed.
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles: ["dev"]
    working_dir: /app
    volumes:
      # Bind mount: live, no-copy window into the same files you edit
      # on the host. Named volumes: cargo's registry/git caches and
      # the compiled target/ dir persist across container restarts and
      # rebuilds, which is what actually makes this fast (not anything
      # baked into the image -- see Dockerfile.dev's own note on why
      # cargo-chef is skipped here).
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - api-target:/app/target
      # rustup's own component store (RUSTUP_HOME) -- rust-toolchain.toml
      # declares rustfmt/clippy, and rustup installs whatever's missing
      # on first use against the bind-mounted project. Without this
      # volume, that download would silently repeat on every container
      # recreation (down+up, not just an image rebuild) since anything
      # outside a volume lives in the container's disposable writable
      # layer. Found empirically: the first `up` re-downloaded clippy.
      - cargo-rustup:/usr/local/rustup
    ports:
      # 8080, matching the app's own PORT default -- forwarded so
      # `cargo run` (started manually, see Dockerfile.dev) is reachable
      # at localhost:8080 exactly like running it directly on the host.
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      # ts-rs writes TypeScript bindings as a side effect of the
      # `export_bindings_*` tests this container's watch loop runs on every
      # save. Left at its default (`./bindings` inside each crate), that
      # output lands in the BIND-MOUNTED checkout owned by root (this
      # container runs as root), and the next host-side `cargo test` /
      # `scripts/preflight.sh` then fails every `export_bindings_*` test
      # with `PermissionDenied` -- which looks like a code bug and is not.
      # Pointing it at container-local /tmp keeps the watcher's output off
      # the host entirely. Host runs are unaffected, and the explicit
      # overrides in `npm run generate-types` / `scripts/check_ts_bindings.sh`
      # (their own env) are the only way bindings reach unitprep-ui.
      TS_RS_EXPORT_DIR: "/tmp/ts-bindings"
      # Defaults to just http://localhost:3000/:5173 (see
      # allowed_origins() in src/api/router/mod.rs) -- unitprep-ui's own
      # dev container runs on host port 3001, not 3000, because this
      # machine already has a native `next dev` listening on 3000 (see
      # unitprep-ui's docker-compose.yml). Both are listed so either one
      # works, whichever the browser is actually pointed at. Found the
      # hard way: the frontend's own "could not reach the API" error was
      # the browser's CORS block, not a real connectivity problem --
      # the request was reaching the server (visible in its own logs),
      # the browser was just refusing to hand the response to the page.
      CORS_ALLOWED_ORIGINS: "http://localhost:3001,http://localhost:3000"
      # Same root cause as CORS above, different mechanism: WebAuthn
      # (passkey) ceremonies cryptographically bind the browser's
      # actual origin into the request, verified server-side against
      # this single value -- unlike CORS, there's no list/multi-value
      # support here, so pick the one origin the browser will actually
      # present. Defaults to http://localhost:3000 (see main.rs); set
      # explicitly to ui-dev's real port so passkey login/registration
      # actually works against the dev containers. Found the hard way:
      # a passkey ceremony failed with "The clients relying party
      # origin does not match our servers information" -- a real
      # WebAuthn security check doing exactly what it's supposed to,
      # not a bug, just misconfigured for this port.
      WEBAUTHN_RP_ORIGIN: "http://localhost:3001"
      # For manually running the #[ignore]'d real-DB integration tests
      # (docker compose exec api-dev cargo test -- --ignored <name>) --
      # never read by the auto-run loop above, which cargo test
      # excludes #[ignore]'d tests from by default (see src/db.rs's
      # connect_test(), which reads this var specifically, hard-fails
      # if unset, and refuses to touch anything with a .neon.tech host
      # even if this were ever pointed at one by mistake). Points only
      # at the local ephemeral test-db, on the internal Docker network
      # (its own internal port 5432, not the host-mapped 5433) -- never
      # anything resembling NEON_DEV_DATABASE_URL*/NEON_PROD_DATABASE_URL*.
      #
      # Connects as app_service, NOT the postgres superuser -- found via
      # external review, 2026-09-29: a superuser/table-owner connection
      # bypasses every row-level-security policy silently, so tests run
      # this way pass without actually proving RLS holds. app_service's
      # password here is set by scripts/bootstrap_test_db.sh, which
      # must run first against any freshly-recreated test-db.
      TEST_DATABASE_URL: postgres://app_service:app_service@test-db:5432/unitprep_test
    depends_on:
      test-db:
        condition: service_healthy
    # No HEALTHCHECK here -- deliberately. The main process is the
    # test-watch loop, not the app server, so there's usually nothing
    # listening on 8080 to health-check against (see Dockerfile.dev).
    # A HEALTHCHECK hitting /health would just be wrong most of the
    # time under normal operation, not merely unused.

volumes:
  cargo-registry:
  cargo-git:
  cargo-rustup:
  api-target:
