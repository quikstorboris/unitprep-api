[package]
name = "docx-surgeon"
version = "0.1.0"
edition.workspace = true
description = "Surgical, minimal-diff text edits inside a .docx -- replace exact text spans without touching anything else in the file."

[dependencies]
quick-xml = { workspace = true }
zip = { workspace = true }

# RegionRef derives Serialize/Deserialize so unitprep-tagger-pipeline's
# RegionCandidate (which embeds it) can round-trip through
# unitprep_core::durable_session_store::DurableSessionStore as part of
# TaggerSession.
serde = { workspace = true }
