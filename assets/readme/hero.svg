<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">unitprep-api</title>
  <desc id="desc">Passkey-authenticated Rust/Axum backend for UnitPrep: client management sourced from Process Street, plus Group Prep, duplicate tenant check, and Template Tagger, all sharing one session engine.</desc>

  <defs>
    <style>
      .eyebrow { font: 15px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; fill: #8A8F92; }
      .name { font: 600 58px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F4F1EA; }
      .desc { font: 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #C9C6BE; }
      .chip-label { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1px; fill: #8A8F92; }
      .chip-label-accent { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1px; fill: #E2A63B; }
      .legend { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #8A8F92; }
      .row-label { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1px; fill: #8A8F92; }
      .surface { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F4F1EA; }
      .surface-sub { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #8A8F92; }
      .foundation { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1px; fill: #0B0D0E; }
    </style>
  </defs>

  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="24" fill="#0B0D0E" stroke="#2B2F31" stroke-width="1.5"/>

  <!-- Left: identity -->
  <g id="title-block">
    <polygon points="64,60 71,67 64,74 57,67" fill="#E2A63B"/>
    <text x="80" y="72" class="eyebrow">RUST · AXUM · INTERNAL PLATFORM API</text>

    <text x="64" y="140" class="name">unitprep-api</text>

    <text x="64" y="182" class="desc">One backend, one passkey-authenticated session</text>
    <text x="64" y="208" class="desc">engine, a growing set of onboarding surfaces.</text>

    <rect x="64" y="232" width="200" height="32" rx="16" fill="none" stroke="#E2A63B" stroke-width="1.5"/>
    <text x="164" y="252" text-anchor="middle" class="chip-label-accent">PASSKEY + TOTP · ENFORCED</text>

    <rect x="280" y="232" width="168" height="32" rx="16" fill="none" stroke="#2B2F31" stroke-width="1.5"/>
    <text x="364" y="252" text-anchor="middle" class="chip-label">7-CRATE WORKSPACE</text>

    <polygon points="64,300 70,306 64,312 58,306" fill="none" stroke="#E2A63B" stroke-width="1.5"/>
    <text x="80" y="311" class="legend">every candidate match flagged for human review — never auto-applied</text>
  </g>

  <!-- Right: one backend, four surfaces, one auth foundation -->
  <g id="project-proof">
    <line x1="628" y1="40" x2="628" y2="300" stroke="#2B2F31" stroke-width="1.5"/>

    <text x="652" y="58" class="row-label">ONE BACKEND · FOUR SURFACES</text>

    <g transform="translate(652,78)">
      <rect width="240" height="72" rx="10" fill="#15181A" stroke="#E2A63B" stroke-width="1.5"/>
      <text x="16" y="30" class="surface">Client management</text>
      <text x="16" y="52" class="surface-sub">Process Street import + sync</text>
    </g>
    <g transform="translate(908,78)">
      <rect width="120" height="72" rx="10" fill="#15181A" stroke="#2B2F31" stroke-width="1.5"/>
      <text x="16" y="30" class="surface">Group Prep</text>
      <text x="16" y="52" class="surface-sub">unit groups</text>
    </g>
    <g transform="translate(1044,78)">
      <rect width="100" height="72" rx="10" fill="#15181A" stroke="#2B2F31" stroke-width="1.5"/>
      <text x="14" y="30" class="surface">Dedup</text>
      <text x="14" y="52" class="surface-sub">tenants</text>
    </g>

    <g transform="translate(652,166)">
      <rect width="240" height="52" rx="10" fill="#15181A" stroke="#2B2F31" stroke-width="1.5"/>
      <text x="16" y="22" class="surface">Template Tagger</text>
      <text x="16" y="41" class="surface-sub">QMS document templates</text>
    </g>
    <g transform="translate(908,166)">
      <rect width="236" height="52" rx="10" fill="#15181A" stroke="#2B2F31" stroke-width="1.5"/>
      <text x="16" y="22" class="surface">Dropbox integration</text>
      <text x="16" y="41" class="surface-sub">encrypted, admin-configured</text>
    </g>


    <rect x="652" y="258" width="492" height="36" rx="10" fill="#E2A63B"/>
    <text x="898" y="281" text-anchor="middle" class="foundation">WEBAUTHN + TOTP SESSION AUTH · RBAC · AUDIT LOG</text>
  </g>
</svg>
