[workspace]
members = ["core", "unit-group", "dedup", "template-tagger", "docx-surgeon", "tagger-pipeline"]
# This root Cargo.toml is both the workspace manifest and the
# `unitprep` binary's own package manifest — the binary crate stays at
# the repo root (unchanged import paths, unchanged build command) while
# `core` and `unit-group` are separate library crates it will depend on
# as the migration proceeds. See project docs / CHANGELOG for the
# rationale (shared engine for session storage + ingestion, reused by
# every UnitPrep tool, versus each tool's own domain logic kept in its
# own crate).

[package]
name = "unitprep"
version = "1.8.16"
edition = "2021"

authors = ["Boris Maksimov <bmaksimov@quikstor.com>"]

description = "Web API for storage facility unit group analysis, net-new group identification, and QMS import preparation."

license = "MIT OR Apache-2.0"

repository = "https://github.com/quikstorboris/unitPrep.git"

[dependencies]

# Shared engine: file ingestion/parsing (and, soon, session storage).
unitprep-core = { path = "core" }

# Duplicate-tenant-check domain logic (grouping/comparison/notes) — the
# binary owns only session/HTTP orchestration for this tool, same as
# UnitGroup's domain logic vs. its own orchestration here.
unitprep-dedup = { path = "dedup" }

# UnitGroup's own domain logic (discovery-result data, batch/fingerprint
# analysis, validation, corrections) — extracted out of src/domain/ into
# its own crate, same boundary as unitprep-dedup: this binary owns only
# session/HTTP orchestration for it.
unitprep-unit-group = { path = "unit-group" }

# QMS Template Tagging Assistant: docx-surgeon reads/edits a .docx's
# flattened regions, unitprep-tagger-pipeline wires it together with
# unitprep-template-tagger's two matchers — same "binary owns session/
# HTTP orchestration only" boundary as the two crates above. The binary
# also depends on template-tagger directly (not just transitively via
# tagger-pipeline) since the /tagger/check handler builds
# LabelProximityPattern values straight from the DB.
docx-surgeon = { path = "docx-surgeon" }
unitprep-tagger-pipeline = { path = "tagger-pipeline" }
unitprep-template-tagger = { path = "template-tagger" }

# Core error handling
anyhow = "1"

# CSV *writing* — infrastructure/csv_export.rs uses csv::Writer to build
# export output. Parsing/reading input CSVs lives entirely in
# unitprep-core now; this is a distinct, still-legitimate direct use.
csv = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Date/time support
chrono = { version = "0.4", features = ["clock"] }

# Web framework
axum = { version = "0.8", features = ["multipart"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Middleware. "catch-panic" turns a handler panic into the project's own
# ApiErrorBody 500 shape (see api::mod::handle_panic) instead of dropping
# the connection with no response at all. "trace" + "request-id" back the
# per-request correlation id (see router::router's layer stack) -- the
# "worth having, not yet" item from the 2026-07-30 logging roadmap,
# revisited now that more people are about to start using Orchestrator.
tower-http = { version = "0.6", features = ["cors", "catch-panic", "trace", "request-id"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Session IDs
uuid = { version = "1", features = ["v4"] }

# client_ops::vendor_format's in-memory registry cache -- same
# non-poisoning-on-panic rationale unitprep-core already uses it for
# (see that crate's own Cargo.toml comment): a panicked reader/writer
# must never permanently wedge vendor recognition for the rest of the
# process's life the way a poisoned std::sync::RwLock would.
parking_lot = "0.12"

# ZIP export generation
zip = "2"

# XLSX export generation (dedup only) — no existing dependency covers
# writing; unitprep-core's `calamine` (used for parsing uploaded .xlsx
# files) is read-only.
rust_xlsxwriter = "0.96"

# Database access -- Postgres via Neon, connecting as the app_service
# role (see scripts/setup_app_service_role.sql and db.rs). tls-rustls
# is a pure-Rust TLS backend, avoiding an OpenSSL system dependency;
# Neon requires TLS regardless of which backend provides it. uuid,
# chrono, ipnetwork, and json enable the column-type mappings the auth
# schema actually uses (UUID PKs, TIMESTAMPTZ, INET, JSONB).
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "ipnetwork", "json"] }

# Loads .env.local into the process environment at startup (see
# main.rs) -- not required in a deployed environment, where real env
# vars are injected directly instead.
dotenvy = "0.15"

# Only for log::LevelFilter, the type sqlx's own log_slow_statements API
# takes (src/db.rs) -- sqlx's actual query-logging events go through
# `tracing` regardless (see that call site's own comment), this crate is
# not otherwise used or wired to anything.
log = "0.4"

# Passkey/WebAuthn registration and authentication -- see src/auth.
#
# danger-allow-state-serialisation is needed because the ceremony
# state returned between the begin and finish steps of a registration
# or authentication must be persisted across two separate HTTP
# requests; without this feature those state types are not
# serializable at all. Pulls in an OpenSSL system dependency via its
# default-on attestation feature -- unrelated to sqlx's own tls-rustls
# choice above, just a second, independent dependency tree, needed
# for attestation certificate-chain verification.
#
# danger-credential-internals exposes the `Credential` type via
# From<Passkey>, which is the only supported way to read a credential's
# Backup Eligibility flag -- `Passkey` itself exposes just cred_id,
# algorithm, public key and update_credential. We need it to record
# whether a registered passkey is device-bound or synced
# (webauthn_credentials.device_bound); without it the alternative is
# parsing webauthn-rs's serialized blob, whose shape is explicitly not
# guaranteed and which would fail silently rather than at compile time.
#
# The crate's warning on this feature is specifically about *changing*
# internal Credential values ("you do not change internal Credential
# values without understanding the implications") and it names reading
# internals for storage purposes as an intended use. We only ever read
# one boolean and never mutate a Credential, so that risk does not
# apply here.
webauthn-rs = { version = "0.5.5", features = [
    "danger-allow-state-serialisation",
    "danger-credential-internals",
] }

# Used for AuthError (src/auth/mod.rs) -- ergonomic #[error(...)] derive
# rather than hand-writing Display impls.
thiserror = "2.0.19"

# Only used to construct the rp_origin Url the webauthn-rs builder
# requires (see WebauthnRsBackend::new) -- already in the dependency
# tree transitively, added explicitly since our own code references it
# directly.
url = "2.5.8"

# CookieJar extractor for the session cookie (src/auth/session_cookie.rs)
# -- deliberately the plain (unsigned, unencrypted) cookie feature only,
# not cookie-private/cookie-signed: the session token itself is opaque
# random data, verified via a database round-trip (resolve_session),
# not a claim we would ever trust from the cookie value directly, so
# there is nothing here worth encrypting or signing.
axum-extra = { version = "0.12.6", features = ["cookie"] }

# Hashes the raw session token before it is ever persisted (see
# sessions.token_hash) -- src/auth/session_token.rs.
sha2 = "0.11.0"

# Encodes the raw random session token into a cookie-safe string.
base64 = "0.22.1"

# Cookie max-age duration type, required by axum-extra's Cookie builder.
time = "0.3.54"

# Fills the raw session token's random bytes from the OS CSPRNG --
# lower-level than the rand crate and sufficient on its own for this
# one use (no need for rand's broader RNG abstraction just to fill a
# byte buffer).
getrandom = { version = "0.4.3", features = ["std"] }

# TOTP (Phase 2 task 9), the fallback factor for a device with no passkey
# enrolled. The architecture named this crate specifically; it is the
# Kanidm-adjacent, widely-used option, and it handles the parts of RFC 6238
# that are easy to get subtly wrong -- base32 secret encoding, the time-step
# skew window, and building the otpauth:// URI an authenticator app scans.
#
# default-features = false deliberately: the default set pulls in `qrcode`
# and `image` to render QR codes server-side, which is a lot of build for
# something the frontend can do from the URI string with any JS QR library.
# "otpauth" is the one feature actually needed (URI generation + parsing).
totp-rs = { version = "5.7", default-features = false, features = ["otpauth"] }

# Encrypts the TOTP secret at rest (auth.totp_credentials.secret_encrypted).
#
# A TOTP secret is a long-lived shared secret -- unlike a session token it
# cannot be revoked by deleting a row somewhere else, and unlike a passkey
# the server holds the whole thing. So it is the one credential in this
# schema that genuinely must not sit in plaintext, which is why the schema
# named the column `secret_encrypted` before anything could write to it.
#
# ChaCha20-Poly1305 rather than AES-GCM: both are fine, but ChaCha needs no
# AES-NI to be fast, and this runs on whatever hardware the deployment
# happens to have. AEAD (not bare encryption) matters here because the
# additional-data field lets each ciphertext be bound to its own user_id --
# see auth::totp for why that is worth doing.
chacha20poly1305 = "0.10.1"

# Decodes the hex-encoded TOTP_ENCRYPTION_KEY from the environment. Kept
# separate from base64 above rather than reusing it: a key is copied by hand
# between a secret store and an env var, and hex survives that without the
# +/= characters that get mangled in shell quoting and .env parsing.
hex = "0.4.3"

# Rate limiting for the unauthenticated auth endpoints (Phase I item 2) --
# a Tower/Axum middleware over the `governor` crate's in-process token
# bucket. Deliberately not a hosted/edge rate-limiting service: this is
# the same self-hosted-library-over-service preference as the rest of
# auth (see AUTHENTICATION.md), and an in-process limiter needs no new
# infrastructure decision to ship now. default-features = false drops the
# `tonic` feature (gRPC support, unused here); "axum" is the integration
# itself, "tracing" matches every other subsystem's instrumentation.
tower_governor = { version = "0.8", default-features = false, features = ["axum", "tracing"] }

# IANA timezone database (with DST rules) -- needed for the audit-log
# PDF's "Generated at" line to show a correct Pacific-time equivalent
# alongside UTC. Plain chrono has no DST logic at all (FixedOffset is a
# constant offset, and chrono::Local depends on the server's own system
# timezone, not "wherever the reader is") -- a hardcoded "-8" would be
# wrong for half the year (PDT is -7). This is exactly what pulls in the
# real IANA rules for correctly deciding PST vs PDT on any given date.
chrono-tz = "0.10"

# PDF generation for the admin audit-log export report. Chosen over genpdf
# (the higher-level layout crate built on top of this one) specifically
# for genpdf's own biggest cost: it has no built-in-font path at all, only
# loading external TTF files at runtime, which would mean bundling/shipping
# font assets with the binary. printpdf supports the 14 standard PDF fonts
# (Helvetica here) built into every PDF viewer -- zero extra assets, same
# self-hosted-library preference as the rest of this project, and plenty
# for a plain tabular report.
#
# default-features = false is deliberate and load-bearing: printpdf's
# default feature ("html") pulls in a full HTML/CSS layout engine (the
# `azul` crates -- azul-core/azul-css/azul-layout, plus rust-fontconfig,
# a flexbox engine, etc.), none of which this module uses. The manual,
# fixed-column table layout in audit_log_pdf.rs needs only printpdf's
# core PDF-writing path. "png" adds just the `image` crate's PNG decoder
# for the report's letterhead logo -- still nowhere near the html/svg
# feature chain, which would pull the whole azul tree straight back in.
printpdf = { version = "0.12", default-features = false, features = ["png"] }

# Dropbox integration (src/dropbox) -- talks to api.dropboxapi.com and
# www.dropbox.com/oauth2 directly (no official Dropbox SDK for Rust
# exists). Previously present only as a dev-dependency (below), used
# solely to HTTP-test this app's own router over plain loopback HTTP
# (src/api/http_integration_tests.rs) -- this is the first real outbound
# use, and the first that needs HTTPS, which is why "rustls-tls" is
# explicit here and wasn't needed on the dev-dependency entry:
# default-features = false drops reqwest's default TLS backend
# entirely, and rustls-tls (matching sqlx's own TLS choice above) avoids
# pulling in a second, independent OpenSSL dependency tree alongside
# webauthn-rs's.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]

# Reads the xlsx exporter's own output back in its tests, so those
# tests verify real cell values/structure instead of just "some bytes
# came out". Same version already pinned in core/Cargo.toml.
calamine = "0.36"

# A real HTTP client for the integration tests in
# src/api/http_integration_tests.rs -- these bind the actual router to a
# real loopback port and make real requests, since some bugs (the CORS
# credentials gap) only ever show up at the router/middleware layer, not
# from calling a handler function directly.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }

# Several TOTP tests (src/auth/totp.rs and src/api/auth_totp.rs) set or
# remove the process-global TOTP_ENCRYPTION_KEY env var, which races under
# the default parallel test runner -- one test's mutation is visible to
# another mid-assertion. #[serial(totp_env)] gives them a shared named lock
# so they run one-at-a-time relative to each other without serializing the
# whole suite.
serial_test = "4"
